- insert:
    - id: maomao-dsh-qq
      name: maomao-dsh-panel/qq
      config:
        enabled: false
        agentPreset: maomao-qq-ordinary
        shadow:
          enabled: true
          semantic:
            enabled: false
          delivery:
            enabled: false
            groupAllowlist: []
        ordinary:
          enabled: false
        stickers:
          enabled: false
          collect: false
          embedding: false
        voice:
          enabled: false
        imageGeneration:
          enabled: false
    - id: maomao-qq-ordinary-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: maomao-qq-ordinary
        name: 猫猫 · QQ 聊天
        description: QQ 连接器自动使用，在 QQ 群内按群和发言者读取记忆。
